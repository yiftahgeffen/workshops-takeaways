document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 0 30px;\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:14px;\">\n        <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(40px,6vw,68px);font-weight:800;line-height:.9;color:transparent;-webkit-text-stroke:1.4px #c6cdec;\">01<\u002Fspan>\n        <div style=\"height:1px;flex:1;background:linear-gradient(90deg,#d8ddf0,transparent);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:clamp(34px,5vw,52px);line-height:1.08;margin:0 0 18px;color:#161c2d;\">כלי AI לניתוח נתונים<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(18px,2.2vw,22px);line-height:1.6;color:#4a5468;max-width:720px;margin:0 0 44px;\">\n        כלי ה‑AI מאפשרים לנו להבין, לנתח ולחלץ תובנות מתוך נתונים — <strong style=\"color:#4d63e6;font-weight:700;\">בלי לכתוב נוסחאות ובלי להיות מומחי אקסל.<\u002Fstrong>\n      <\u002Fp>\n\n      <h3 data-reveal=\"\" style=\"font-size:15px;font-weight:700;letter-spacing:.08em;color:#8a92a8;text-transform:uppercase;margin:0 0 20px;\">מה Copilot יודע לעשות עם נתונים<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px;margin-bottom:56px;\">\n\n        <div data-reveal=\"\" style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .3s ease,box-shadow .3s ease;\" style-hover=\"transform:translateY(-6px);box-shadow:0 26px 46px -26px rgba(40,60,120,.32)\">\n          <div style=\"width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#eef1fd,#f3edfd);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:13px;margin-bottom:18px;\">\n            <span style=\"width:5px;height:10px;border-radius:2px;background:#4d63e6;\"><\u002Fspan>\n            <span style=\"width:5px;height:18px;border-radius:2px;background:#6a7ce9;\"><\u002Fspan>\n            <span style=\"width:5px;height:14px;border-radius:2px;background:#8b5cf0;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h4 style=\"font-size:19px;font-weight:700;margin:0 0 8px;color:#161c2d;\">אשף ויזואליזציה<\u002Fh4>\n          <p style=\"font-size:15.5px;line-height:1.6;color:#717a90;margin:0;\">הופך שורות של נתונים לגרפים ותרשימים בלחיצת כפתור.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .3s ease,box-shadow .3s ease;\" style-hover=\"transform:translateY(-6px);box-shadow:0 26px 46px -26px rgba(40,60,120,.32)\">\n          <div style=\"width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#eef1fd,#f3edfd);display:flex;align-items:center;justify-content:center;margin-bottom:18px;\">\n            <span style=\"width:18px;height:18px;border-radius:50%;border:2.5px solid #4d63e6;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h4 style=\"font-size:19px;font-weight:700;margin:0 0 8px;color:#161c2d;\">מנקה וצייד חריגות<\u002Fh4>\n          <p style=\"font-size:15.5px;line-height:1.6;color:#717a90;margin:0;\">מארגן דאטה מלוכלך ומאתר שגיאות נסתרות שקל לפספס.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .3s ease,box-shadow .3s ease;\" style-hover=\"transform:translateY(-6px);box-shadow:0 26px 46px -26px rgba(40,60,120,.32)\">\n          <div style=\"width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#eef1fd,#f3edfd);display:flex;align-items:center;justify-content:center;margin-bottom:18px;\">\n            <span style=\"width:16px;height:16px;background:linear-gradient(135deg,#4d63e6,#8b5cf0);transform:rotate(45deg);border-radius:3px;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h4 style=\"font-size:19px;font-weight:700;margin:0 0 8px;color:#161c2d;\">אנליסט שותף<\u002Fh4>\n          <p style=\"font-size:15.5px;line-height:1.6;color:#717a90;margin:0;\">מציף מגמות ועוזר להבין אילו שאלות בכלל כדאי לשאול.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .3s ease,box-shadow .3s ease;\" style-hover=\"transform:translateY(-6px);box-shadow:0 26px 46px -26px rgba(40,60,120,.32)\">\n          <div style=\"width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#eef1fd,#f3edfd);display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:18px;\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#4d63e6;\"><\u002Fspan>\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#8b5cf0;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h4 style=\"font-size:19px;font-weight:700;margin:0 0 8px;color:#161c2d;\">תשובות עסקיות<\u002Fh4>\n          <p style=\"font-size:15.5px;line-height:1.6;color:#717a90;margin:0;\">לא רק נוסחאות — מעבר משאילתות טכניות לפתרון בעיות בשפה טבעית.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- prompt principles -->\n      <div data-reveal=\"\" style=\"background:linear-gradient(135deg,#1c2340,#2a2f5c);border-radius:28px;padding:clamp(28px,4vw,46px);color:#fff;position:relative;overflow:hidden;margin-bottom:56px;\">\n        <div style=\"position:absolute;top:-80px;left:-40px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,240,.4),transparent 70%);pointer-events:none;\"><\u002Fdiv>\n        <div style=\"position:relative;\">\n          <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(24px,3.4vw,34px);font-weight:700;margin:0 0 8px;\">הנדסת הפרומפט הנכון<\u002Fh3>\n          <p style=\"font-size:16px;color:rgba(255,255,255,.7);margin:0 0 30px;max-width:560px;line-height:1.6;\">ארבעה כללים שהופכים בקשה ממוצעת לתשובה שבאמת עוזרת.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;\">\n            <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:700;color:#9db0ff;margin-bottom:8px;\">א'<\u002Fdiv>\n              <h4 style=\"font-size:17.5px;font-weight:700;margin:0 0 6px;\">פרקו בקשות מורכבות<\u002Fh4>\n              <p style=\"font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.66);margin:0;\">צעד אחר צעד עדיף על בקשה ענקית אחת.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:700;color:#9db0ff;margin-bottom:8px;\">ב'<\u002Fdiv>\n              <h4 style=\"font-size:17.5px;font-weight:700;margin:0 0 6px;\">פשטות ובהירות<\u002Fh4>\n              <p style=\"font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.66);margin:0;\">נסחו פשוט, אבל תנו מספיק הקשר.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;\">\n              <div style=\"font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:700;color:#9db0ff;margin-bottom:8px;\">ג'<\u002Fdiv>\n              <h4 style=\"font-size:17.5px;font-weight:700;margin:0 0 6px;\">התייחסו לתובנות<\u002Fh4>\n              <p style=\"font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.66);margin:0;\">בקשו משמעות עסקית, לא רק שורות נתונים.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18p \"{{ c4.done }}\" hint-placeholder-val=\"{{ false }}\"><span>✓<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n            <p style=\"{{ c4.textStyle }}\">לחצו על \"הצג הנחיות\", העמיקו ביכולות הנוספות, ומצאו לפחות 2 הנחיות שרלוונטיות לעבודה היום‑יומית שלכם.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:flex;gap:14px;align-items:flex-start;\">\n            <button onclick=\"{{ c5.toggle }}\" aria-label=\"סמן כבוצע\" style=\"{{ c5.boxStyle }}\"><sc-if value=\"{{ c5.done }}\" hint-placeholder-val=\"{{ false }}\"><span>✓<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n            <p style=\"{{ c5.textStyle }}\">שתפו ופידבק: הראו את התוצאה לחבר או לקבוצה וקבלו רעיונות לשיפור הפרומפט.<\u002Fp>\n          <\u002Fli>\n        <\u002Ful>\n\n        <div style=\"background:#f9f7fd;border:1px solid #ece6f6;border-radius:18px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;\">\n            <span style=\"font-size:13px;font-weight:700;letter-spacing:.06em;color:#9b8ab8;text-transform:uppercase;\">דוגמת פרומפט להתחלה<\u002Fspan>\n            <button onclick=\"{{ copyComms }}\" style=\"cursor:pointer;border:1px solid #ddd2ef;background:#fff;color:#8b5cf0;font-family:inherit;font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:999px;transition:all .2s ease;\" style-hover=\"background:#f3edfd\">{{ commsCopyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p id=\"prompt-comms\" style=\"margin:0;font-size:15.5px;line-height:1.7;color:#36405a;\">תן לי רשימה של 15 המיילים האחרונים שדורשים ממני תשובה או התייחסות, סדר אותם לפי דחיפות, והצע למענה קצר ומקצועי לכל אחד מהם.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== PRINCIPLES ===================== -->\n    <section id=\"principles\" data-screen-label=\"עקרונות לזכור\" style=\"padding:80px 0 40px;\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:14px;\">\n        <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(40px,6vw,68px);font-weight:800;line-height:.9;color:transparent;-webkit-text-stroke:1.4px #bfe0e6;\">03<\u002Fspan>\n        <div style=\"height:1px;flex:1;background:linear-gradient(90deg,#cfeaef,transparent);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:clamp(34px,5vw,52px);line-height:1.08;margin:0 0 18px;color:#161c2d;\">העקרונות שיעשו את ההבדל<\u002Fh2>\n      <p data-reveal=\"\" style=\"font-size:clamp(18px,2.2vw,22px);line-height:1.6;color:#4a5468;max-width:720px;margin:0 0 44px;\">שישה הרגלים שכדאי לקחת מהסדנה הביתה — נכונים לכל כלי AI, לא רק ל‑Copilot.<\u002Fp>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;\">\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#4d63e6;line-height:1;\">01<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">היו ספציפיים ומפורטים<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">ככל שתפרטו יותר, התשובה תהיה מדויקת יותר.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#6470ea;line-height:1;\">02<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">תנו הקשר<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">ספרו לכלי מי אתם, מה המטרה ומי הקהל.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#7466ea;line-height:1;\">03<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">פרקו משימות מורכבות<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">שברו בקשה גדולה לכמה צעדים קטנים וברורים.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#845cf0;line-height:1;\">04<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">בקשו תובנות ופעולות<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">לא רק מידע — בקשו משמעות וצעדים מעשיים.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#8b5cf0;line-height:1;\">05<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">עבדו בתהליך<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">שאלו, קבלו, חדדו ושאלו שוב — זו שיחה.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:22px;padding:26px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n          <span style=\"font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:800;color:#9a5cee;line-height:1;\">06<\u002Fspan>\n          <div><h4 style=\"font-size:18px;font-weight:700;margin:0 0 5px;color:#161c2d;\">התייחסו אליו כעוזר אישי<\u002Fh4><p style=\"font-size:15px;color:#717a90;line-height:1.55;margin:0;\">לא מנוע חיפוש — שותף שעוזר לכם לעבוד טוב יותר.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- interactive prompt builder -->\n      <div data-reveal=\"\" style=\"margin-top:40px;background:#fff;border:1px solid #e6e9f2;border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.04),0 30px 60px -40px rgba(40,60,120,.35);\">\n        <div style=\"padding:26px clamp(22px,3.4vw,34px) 0;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n            <span style=\"width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#4d63e6,#8b5cf0);box-shadow:0 0 0 4px rgba(77,99,230,.12);\"><\u002Fspan>\n            <span style=\"font-size:13.5px;font-weight:700;letter-spacing:.03em;color:#4d63e6;\">תרגול חי<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(26px,3.4vw,36px);font-weight:800;margin:0 0 6px;color:#161c2d;\">בנו פרומפט מנצח<\u002Fh3>\n          <p style=\"font-size:16px;color:#717a90;margin:0 0 4px;line-height:1.6;max-width:640px;\">מלאו את השדות והפרומפט המורכב ייבנה למטה, מוכן להעתקה. לא חייבים למלא את כולם — קחו את מה שרלוונטי.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(244px,1fr));gap:16px;padding:22px clamp(22px,3.4vw,34px);\">\n          <div>\n            <label style=\"display:block;font-size:13px;color:#4d63e6;margin-bottom:8px;font-weight:700;\">תפקיד<\u002Flabel>\n            <input value=\"{{ pRole }}\" onchange=\"{{ setRole }}\" dir=\"rtl\" placeholder=\"לדוגמה: מומחה תוכן שיווקי B2B\" style=\"font-family:'Assistant',sans-serif;width:100%;background:#fbfcfe;border:1.5px solid #e0e4f0;border-radius:12px;padding:12px 14px;color:#161c2d;font-size:15px;outline:none;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#4d63e6;margin-bottom:8px;font-weight:700;\">הקשר וקהל יעד<\u002Flabel>\n            <input value=\"{{ pContext }}\" onchange=\"{{ setContext }}\" dir=\"rtl\" placeholder=\"לדוגמה: ניוזלטר אגפי למנהלי ביניים\" style=\"font-family:'Assistant',sans-serif;width:100%;background:#fbfcfe;border:1.5px solid #e0e4f0;border-radius:12px;padding:12px 14px;color:#161c2d;font-size:15px;outline:none;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#4d63e6;margin-bottom:8px;font-weight:700;\">המשימה<\u002Flabel>\n            <input value=\"{{ pTask }}\" onchange=\"{{ setTask }}\" dir=\"rtl\" placeholder=\"לדוגמה: נסח 3 פסקאות פתיחה\" style=\"font-family:'Assistant',sans-serif;width:100%;background:#fbfcfe;border:1.5px solid #e0e4f0;border-radius:12px;padding:12px 14px;color:#161c2d;font-size:15px;outline:none;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#4d63e6;margin-bottom:8px;font-weight:700;\">סגנון ופורמט<\u002Flabel>\n            <input value=\"{{ pStyle }}\" onchange=\"{{ setStyle }}\" dir=\"rtl\" placeholder=\"לדוגמה: טון מקצועי וקליל, בפסקאות קצרות\" style=\"font-family:'Assistant',sans-serif;width:100%;background:#fbfcfe;border:1.5px solid #e0e4f0;border-radius:12px;padding:12px 14px;color:#161c2d;font-size:15px;outline:none;box-sizing:border-box;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:22px clamp(22px,3.4vw,34px) 28px;background:#f7f8fd;border-top:1px solid #e6e9f2;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;\">\n            <span style=\"font-size:13px;letter-spacing:.06em;color:#8a92a8;text-transform:uppercase;font-weight:700;\">הפרומפט המורכב שלכם<\u002Fspan>\n            <button onclick=\"{{ copyBuilder }}\" style=\"cursor:pointer;border:1px solid #d7dcef;background:#fff;color:#4d63e6;font-family:inherit;font-size:13.5px;font-weight:700;padding:7px 16px;border-radius:999px;transition:all .2s ease;\" style-hover=\"background:#eef1fd\">{{ builderCopyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPrompt }}\" hint-placeholder-val=\"{{ true }}\">\n            <pre style=\"white-space:pre-wrap;font-family:'Assistant',sans-serif;font-size:15.5px;line-height:1.8;color:#36405a;background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:18px 20px;margin:0;\">{{ promptText }}<\u002Fpre>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:15px;color:#9aa2b5;background:#fff;border:1px dashed #d7dcef;border-radius:14px;padding:18px 20px;\">מלאו את השדות למעלה והפרומפט המורכב יופיע כאן, מוכן להעתקה.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer data-screen-label=\"קשר\" style=\"margin-top:60px;padding:60px 24px 70px;background:linear-gradient(135deg,#1c2340,#2a2f5c);color:#fff;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;top:-100px;right:10%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,240,.35),transparent 70%);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;\">\n      <p style=\"font-size:14.5px;color:rgba(255,255,255,.6);margin:0 0 4px;font-weight:600;letter-spacing:.06em;\">סוף הסדנה · נשמח להישאר בקשר<\u002Fp>\n      <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(36px,6vw,58px);font-weight:800;margin:0;line-height:1.05;\">יפתח גפן<\u002Fh3>\n      <p style=\"font-size:16px;color:rgba(255,255,255,.62);margin:2px 0 22px;font-weight:500;\">מנחה הסדנה · פשוט להבין AI<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px;\">\n        <a href=\"mailto:yiftahgeffen@gmail.com\" style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;color:#fff;text-decoration:none;transition:all .2s ease;\" style-hover=\"background:rgba(255,255,255,.16)\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#9db0ff,#c4a5ff);\"><\u002Fspan>\n          yiftahgeffen@gmail.com\n        <\u002Fa>\n        <a href=\"tel:0524663221\" dir=\"ltr\" style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;color:#fff;text-decoration:none;transition:all .2s ease;\" style-hover=\"background:rgba(255,255,255,.16)\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#9db0ff,#c4a5ff);\"><\u002Fspan>\n          052-466-3221\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    checks: (() => { try { return JSON.parse(localStorage.getItem('aiws_checks_v1')) || {}; } catch (e) { return {}; } })(),\n    active: 'top',\n    progress: 0,\n    copied: null,\n    pRole: '', pContext: '', pTask: '', pStyle: ''\n  };\n\n  setField(f) {\n    return (e) => {\n      const v = e.target.value;\n      this.setState(() => ({ [f]: v }));\n    };\n  }\n\n  copyBuilder(text) {\n    if (text && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});\n    this.setState({ copied: 'builder' });\n    clearTimeout(this._copyT);\n    this._copyT = setTimeout(() => this.setState({ copied: null }), 1800);\n  }\n\n  componentDidMount() {\n    // scroll progress + active section\n    this._onScroll = () => {\n      const doc = document.documentElement;\n      const max = doc.scrollHeight - doc.clientHeight;\n      const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;\n      const ids = ['top', 'm1', 'm2', 'principles'];\n      let active = 'top';\n      for (const id of ids) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= 140) active = id;\n      }\n      if (p !== this.state.progress || active !== this.state.active) {\n        this.setState({ progress: p, active });\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    this._onScroll();\n\n    // reveal on scroll\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach((el, i) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(22px)';\n      el.style.transition = 'opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1)';\n    });\n    const reveal = (el) => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; };\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n      els.forEach((el) => io.observe(el));\n      this._failsafe = setTimeout(() => els.forEach(reveal), 3000);\n    } else {\n      els.forEach(reveal);\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onScroll);\n    clearTimeout(this._failsafe);\n    clearTimeout(this._copyT);\n  }\n\n  goTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const y = el.getBoundingClientRect().top + window.scrollY - (id === 'top' ? 0 : 78);\n    window.scrollTo({ top: y, behavior: 'smooth' });\n  }\n\n  toggleCheck(id) {\n    this.setState((s) => {\n      const c = Object.assign({}, s.checks);\n      c[id] = !c[id];\n      try { localStorage.setItem('aiws_checks_v1', JSON.stringify(c)); } catch (e) {}\n      return { checks: c };\n    });\n  }\n\n  copy(elId, key) {\n    const el = document.getElementById(elId);\n    if (el && navigator.clipboard) {\n      navigator.clipboard.writeText((el.innerText || '').trim()).catch(() => {});\n    }\n    this.setState({ copied: key });\n    clearTimeout(this._copyT);\n    this._copyT = setTimeout(() => this.setState({ copied: null }), 1800);\n  }\n\n  step(id) {\n    const done = !!this.state.checks[id];\n    return {\n      done,\n      toggle: () => this.toggleCheck(id),\n      boxStyle: {\n        flex: '0 0 auto', width: '27px', height: '27px', borderRadius: '9px',\n        display: 'flex', alignItems: 'center', justifyContent: 'center',\n        cursor: 'pointer', transition: 'all .25s ease', padding: 0, marginTop: '1px',\n        fontSize: '14px', fontWeight: 700, lineHeight: 1, color: '#fff',\n        border: done ? '1px solid transparent' : '1.5px solid #cdd3e3',\n        background: done ? 'linear-gradient(135deg,#4d63e6,#8b5cf0)' : '#fff',\n        boxShadow: done ? '0 6px 16px -6px rgba(77,99,230,.65)' : 'none'\n      },\n      textStyle: {\n        margin: 0, fontSize: '16.5px', lineHeight: 1.65,\n        transition: 'color .25s ease',\n        color: done ? '#a7aebf' : '#36405a'\n      }\n    };\n  }\n\n  renderVals() {\n    const builderParts = [];\n    if (this.state.pRole) builderParts.push('תפקיד: ' + this.state.pRole + '.');\n    if (this.state.pContext) builderParts.push('הקשר וקהל יעד: ' + this.state.pContext + '.');\n    if (this.state.pTask) builderParts.push('המשימה: ' + this.state.pTask + '.');\n    if (this.state.pStyle) builderParts.push('סגנון ופורמט: ' + this.state.pStyle + '.');\n    const builderText = builderParts.length ? builderParts.join('\\n') : '';\n\n    const sections = [['m1', 'ניתוח נתונים'], ['m2', 'תקשורת עסקית'], ['principles', 'עקרונות']];\n    const nav = sections.map(([id, label]) => {\n      const on = this.state.active === id;\n      return {\n        id, label,\n        go: () => this.goTo(id),\n        style: {\n          cursor: 'pointer', border: 'none', fontFamily: 'inherit',\n          fontSize: '14.5px', fontWeight: 600, padding: '9px 17px',\n          borderRadius: '999px', transition: 'all .25s ease', whiteSpace: 'nowrap',\n          color: on ? '#fff' : '#4a5468',\n          background: on ? 'linear-gradient(135deg,#4d63e6,#8b5cf0)' : 'transparent',\n          boxShadow: on ? '0 8px 18px -8px rgba(77,99,230,.6)' : 'none'\n        }\n      };\n    });\n\n    const m1ids = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6'];\n    const m2ids = ['c1', 'c2', 'c3', 'c4', 'c5'];\n    const m1done = m1ids.filter((i) => this.state.checks[i]).length;\n    const m2done = m2ids.filter((i) => this.state.checks[i]).length;\n\n    const barFill = (pct, grad) => ({\n      width: pct + '%', height: '100%', borderRadius: '999px',\n      background: grad, transition: 'width .4s cubic-bezier(.22,.61,.36,1)'\n    });\n\n    return {\n      nav,\n      goM1: () => this.goTo('m1'),\n      goM2: () => this.goTo('m2'),\n      progressBarStyle: {\n        height: '100%', width: (this.state.progress * 100) + '%',\n        background: 'linear-gradient(90deg,#4d63e6,#8b5cf0)',\n        transition: 'width .1s linear'\n      },\n      d1: this.step('d1'), d2: this.step('d2'), d3: this.step('d3'),\n      d4: this.step('d4'), d5: this.step('d5'), d6: this.step('d6'),\n      c1: this.step('c1'), c2: this.step('c2'), c3: this.step('c3'),\n      c4: this.step('c4'), c5: this.step('c5'),\n      m1Progress: m1done + ' / ' + m1ids.length,\n      m2Progress: m2done + ' / ' + m2ids.length,\n      m1PctStyle: barFill((m1done / m1ids.length) * 100, 'linear-gradient(90deg,#4d63e6,#6a7ce9)'),\n      m2PctStyle: barFill((m2done / m2ids.length) * 100, 'linear-gradient(90deg,#8b5cf0,#a87bf3)'),\n      copyData: () => this.copy('prompt-data', 'data'),\n      copyComms: () => this.copy('prompt-comms', 'comms'),\n      dataCopyLabel: this.state.copied === 'data' ? 'הועתק ✓' : 'העתקה',\n      commsCopyLabel: this.state.copied === 'comms' ? 'הועתק ✓' : 'העתקה',\n      pRole: this.state.pRole, pContext: this.state.pContext,\n      pTask: this.state.pTask, pStyle: this.state.pStyle,\n      setRole: this.setField('pRole'), setContext: this.setField('pContext'),\n      setTask: this.setField('pTask'), setStyle: this.setField('pStyle'),\n      promptText: builderText, hasPrompt: builderParts.length > 0, noPrompt: builderParts.length === 0,\n      copyBuilder: () => this.copyBuilder(builderText),\n      builderCopyLabel: this.state.copied === 'builder' ? 'הועתק ✓' : 'העתקה'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
