document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ze:13.5px;font-weight:700;color:#4d63e6;text-decoration:none;\">פתחו את NotebookLM ↗<\u002Fa>\n                <\u002Fdiv>\n                <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:30px;margin:0 0 10px;line-height:1.2;\">מוח AI שמבוסס רק על החומרים שלכם<\u002Fh3>\n                <p style=\"margin:0 0 24px;color:#4a5468;font-size:16px;line-height:1.7;\">מעלים למחברת את המקורות של המצגת, ו-NotebookLM מפיק ממנה מצגת בחלונית Studio, לפי ההנחיה שכתבתם.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                  <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4d63e6,#8b5cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:16px;flex:none;\">1<\u002Fspan><div><div style=\"font-weight:700;font-size:16.5px;margin-bottom:2px;\">מזינים את המקורות<\u002Fdiv><p style=\"margin:0;color:#4a5468;font-size:15px;line-height:1.65;\">פותחים מחברת חדשה ומעלים את החומרים שעשויים לשמש לבניית המצגת.<\u002Fp><\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4d63e6,#8b5cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:16px;flex:none;\">2<\u002Fspan><div><div style=\"font-weight:700;font-size:16.5px;margin-bottom:2px;\">בוחרים <span style=\"color:#4d63e6;\">מצגת<\u002Fspan> ב-Studio<\u002Fdiv><p style=\"margin:0;color:#4a5468;font-size:15px;line-height:1.65;\">בחלונית Studio בוחרים באריח ״מצגת״ ופותחים את אפשרויות ההתאמה האישית: פורמט, שפה ואורך.<\u002Fp><\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4d63e6,#8b5cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:16px;flex:none;\">3<\u002Fspan><div><div style=\"font-weight:700;font-size:16.5px;margin-bottom:2px;\">מדביקים את ההנחיה בחלונית התיאור<\u002Fdiv><p style=\"margin:0;color:#4a5468;font-size:15px;line-height:1.65;\">בשדה שבו מתארים את המצגת הרצויה מדביקים את ההנחיה שבניתם למטה, ומפיקים.<\u002Fp><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:0 1 300px;min-width:240px;margin:0 auto;\">\n                <div style=\"background:#fff;border:1px solid #e3e6f0;border-radius:20px;padding:10px;box-shadow:0 24px 50px -24px rgba(28,35,64,.45),0 4px 12px -6px rgba(28,35,64,.12);\">\n                  <div style=\"display:flex;align-items:center;gap:6px;padding:2px 6px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#d3d8e6;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#d3d8e6;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#d3d8e6;\"><\u002Fspan><\u002Fdiv>\n                  <div style=\"position:relative;line-height:0;border-radius:12px;overflow:hidden;border:1px solid #eceef6;\">\n                    <img src=\"9d6f1f63-7ad9-4ec9-8d0a-612709966cca\" alt=\"חלונית Studio ב-NotebookLM\" style=\"width:100%;height:auto;display:block;\">\n                    <span style=\"position:absolute;left:5.2%;top:17%;width:43.2%;height:14.4%;border-radius:14px;border:2px solid #4d63e6;animation:pulseRing 1.8s ease-in-out infinite;pointer-events:none;\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- anatomy + builder -->\n          <div data-reveal=\"\" style=\"background:#fff;border:1px solid #e6e9f2;border-radius:28px;padding:34px;box-shadow:0 16px 44px -26px rgba(28,35,64,.4);\">\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;\">\n              <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:30px;margin:0;\">בנו פרומפט מנצח<\u002Fh3>\n              <span style=\"padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#4d63e6,#8b5cf0);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;\">תרגול חי<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"color:#4a5468;margin:0 0 22px;font-size:16px;\">אלה השאלות שהנחיה לכלי עיצוב עונה עליהן. לחצו על כל רכיב כדי לראות איפה הוא יושב בדוגמה.<\u002Fp>\n\n            <div id=\"anatChips\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;\">\n              <button data-chip=\"role\" data-color=\"#4d63e6\" data-desc=\"מגדירים לכלי מי הוא ומה המשימה: הכנת מצגת לכלי עיצוב.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #4d63e6;background:#fff;color:#4d63e6;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">תפקיד ומשימה<\u002Fbutton>\n              <button data-chip=\"aud\" data-color=\"#1f9bb0\" data-desc=\"למי המצגת מיועדת? הקהל קובע את רמת הפירוט, השפה והדוגמאות.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #1f9bb0;background:#fff;color:#1f9bb0;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">קהל היעד?<\u002Fbutton>\n              <button data-chip=\"ctx\" data-color=\"#2e9c5e\" data-desc=\"באיזו מסגרת המצגת תוצג, ומה מצב העניינים שהיא נולדת מתוכו.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #2e9c5e;background:#fff;color:#2e9c5e;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">ההקשר?<\u002Fbutton>\n              <button data-chip=\"msg\" data-color=\"#c27a12\" data-desc=\"המשפט האחד שהקהל צריך לצאת איתו. כל שקף משרת אותו.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #c27a12;background:#fff;color:#c27a12;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">המסר?<\u002Fbutton>\n              <button data-chip=\"raw\" data-color=\"#c94a7d\" data-desc=\"על מה המצגת נשענת: נתונים, מסמכים, סיכומים. בלי חומר גלם הכלי ממציא.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #c94a7d;background:#fff;color:#c94a7d;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">חומר גולמי?<\u002Fbutton>\n              <button data-chip=\"str\" data-color=\"#6d5ce6\" data-desc=\"כמה שקפים ובאיזה סדר. מבנה מוגדר מונע מצגת מפוזרת.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #6d5ce6;background:#fff;color:#6d5ce6;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">מבנה<\u002Fbutton>\n              <button data-chip=\"sty\" data-color=\"#8b5cf0\" data-desc=\"איך המצגת נראית: אווירה, צבעים, כמות טקסט ודימויים.\" style=\"padding:8px 16px;border-radius:999px;border:1.5px solid #8b5cf0;background:#fff;color:#8b5cf0;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;\">סגנון ונראות<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:#f6f7fc;border:1px dashed #c8cfeb;border-radius:20px;padding:22px 24px;margin-bottom:28px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;\">\n                <span style=\"font-size:12px;font-weight:700;letter-spacing:.12em;color:#717a90;\">דוגמה להמחשה<\u002Fspan>\n                <span id=\"anatDesc\" style=\"font-size:14px;color:#4a5468;font-weight:600;\">בחרו רכיב למעלה.<\u002Fspan>\n              <\u002Fdiv>\n              <p id=\"anatText\" style=\"margin:0;color:#2a3350;font-size:16.5px;line-height:2;\">\n                <span data-seg=\"role\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">פעל/י כמעצב/ת מצגות מומחה/ית ובנה/י מצגת מעוצבת.<\u002Fspan>\n                <span data-seg=\"aud\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">קהל היעד: מנהלי מחלקות שאינם אנשי דאטה.<\u002Fspan>\n                <span data-seg=\"ctx\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">ההקשר: ישיבת הנהלה רבעונית, 10 דקות הצגה.<\u002Fspan>\n                <span data-seg=\"msg\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">המסר המרכזי: מעבר לדשבורד אחיד יחסוך לצוותים שעות עבודה בכל שבוע.<\u002Fspan>\n                <span data-seg=\"raw\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">חומר הגלם: סיכום הנתונים והמסקנות המצורפים.<\u002Fspan>\n                <span data-seg=\"str\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">מבנה: 8 שקפים — פתיחה, הבעיה, הפתרון, 3 שקפי נתונים, צעדים הבאים וסיכום.<\u002Fspan>\n                <span data-seg=\"sty\" style=\"border-radius:6px;padding:2px 4px;transition:all .25s;\">סגנון ונראות: נקי ומינימליסטי, גוונים של כחול וסגול, כותרת קצרה ודימוי אחד בכל שקף.<\u002Fspan>\n              <\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"font-weight:700;font-size:17px;margin-bottom:4px;\">עכשיו תורכם<\u002Fdiv>\n            <p style=\"color:#717a90;margin:0 0 16px;font-size:14.5px;\">אין חובה למלא את כל השדות. מלאו את מה שמתאים למצגת שלכם.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;\">\n              <label style=\"display:block;\"><span style=\"display:block;font-weight:700;margin-bottom:6px;color:#4d63e6;\">תפקיד<\u002Fspan><input id=\"pb_role\" type=\"text\" placeholder=\"פעל/י כמעצב/ת מצגות…\" style=\"width:100%;padding:12px 14px;border:1px solid #e6e9f2;border-radius:14px;font-family:inherit;font-size:15px;background:#fbfcff;outline:none;\"><\u002Flabel>\n              <label style=\"display:block;\"><span style=\"display:block;font-weight:700;margin-bottom:6px;color:#1f9bb0;\">הקשר וקהל יעד<\u002Fspan><input id=\"pb_ctx\" type=\"te : { title: 'תרגול: יצירת תמונה מותאמת אישית ב-AI', time: '15 דק׳', items: [\n        'השתמשו בכלי AI ליצירת תמונה למצגת שלכם (DALL·E, Ideogram, Imagine.art)',\n        'כתבו תיאור טקסטואלי מפורט של התמונה שתרצו ליצור',\n        'הורידו את התמונה ושמרו אותה במחשב, לשימוש במצגות, בפרויקטים אישיים או ברשתות',\n        'שתפו את התמונה עם חברים או בקבוצת עבודה, וקבלו פידבק לשיפור',\n      ] },\n      p5: { title: 'תרגיל מסכם: יצירת מצגת מותאמת אישית ב-AI', time: '20 דק׳', items: [\n        'בנו את המצגת: הכניסו לכלי העיצוב (Gamma) את ההנחיה שכתבתם',\n        'שלבו במצגת את הדיאגרמות והתמונות שהכנתם',\n        'עבדו עם כלי העיצוב עד שתגיעו לפרזנטציה מהודקת ובנויה היטב, שתוכל לשמש אתכם להצגה',\n        'שתפו את המצגת עם חברים או בקבוצת עבודה, וקבלו פידבק לשיפור',\n      ] },\n    };\n    $$('[data-checklist]').forEach(holder => {\n      const key = holder.dataset.checklist, cfg = lists[key]; if (!cfg) return;\n      const fin = holder.dataset.final === '1';\n      holder.innerHTML = `<div style=\"background:${fin ? 'linear-gradient(135deg,#1c2340,#2a2f5c)' : '#fff'};border:1px solid ${fin ? 'transparent' : '#e6e9f2'};border-radius:24px;padding:28px 30px;box-shadow:0 12px 36px -24px rgba(28,35,64,${fin ? '.7' : '.4'});color:${fin ? '#fff' : '#161c2d'};\">\n          <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:4px;\">\n            <span style=\"width:30px;height:3px;border-radius:2px;background:linear-gradient(135deg,#4d63e6,#8b5cf0);\"><\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;color:${fin ? '#aeb6e0' : '#717a90'};\">${fin ? 'מחברים הכל' : 'תרגול לחזרה'}<\u002Fspan>\n            <span style=\"margin-inline-start:auto;padding:5px 14px;border-radius:999px;background:${fin ? 'rgba(255,255,255,.12)' : '#eef0fb'};color:${fin ? '#fff' : '#4d63e6'};font-size:13px;font-weight:700;\">⏱ ${cfg.time}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:23px;margin:6px 0 16px;\">${cfg.title}<\u002Fh3>\n          <div data-items style=\"display:flex;flex-direction:column;gap:10px;\"><\u002Fdiv>\n          <div style=\"margin-top:18px;display:flex;align-items:center;gap:12px;\">\n            <div style=\"flex:1;height:8px;border-radius:999px;background:${fin ? 'rgba(255,255,255,.12)' : '#eef0fb'};overflow:hidden;\"><div data-bar style=\"height:100%;width:0%;background:linear-gradient(90deg,#4d63e6,#8b5cf0);transition:width .35s;\"><\u002Fdiv><\u002Fdiv>\n            <span data-count style=\"font-weight:700;font-size:14px;color:${fin ? '#dfe2f6' : '#4a5468'};white-space:nowrap;\">0 / ${cfg.items.length}<\u002Fspan>\n          <\u002Fdiv><\u002Fdiv>`;\n      const wrap = $('[data-items]', holder), bar = $('[data-bar]', holder), count = $('[data-count]', holder);\n      const offBg = fin ? 'rgba(255,255,255,.05)' : '#fbfcff', offBd = fin ? 'rgba(255,255,255,.14)' : '#e6e9f2', offTx = fin ? '#e8ebfb' : '#2a3350';\n      const onBg = fin ? 'rgba(46,156,94,.18)' : '#eef7f1', onBd = fin ? 'rgba(46,156,94,.5)' : '#cde8d6', onTx = fin ? '#bfe6cf' : '#2c5e44';\n      const paint = (btn, on) => {\n        const tick = $('[data-tick]', btn), label = $('[data-label]', btn);\n        btn.style.background = on ? onBg : offBg; btn.style.borderColor = on ? onBd : offBd;\n        tick.style.border = '2px solid ' + (on ? '#2e9c5e' : (fin ? 'rgba(255,255,255,.35)' : '#c8cfeb'));\n        tick.style.background = on ? '#2e9c5e' : 'transparent'; tick.textContent = on ? '✓' : '';\n        label.style.color = on ? onTx : offTx; label.style.textDecoration = on ? 'line-through' : 'none'; label.style.opacity = on ? '.75' : '1';\n      };\n      const update = () => { const d = $$('[data-cb]', holder).filter(b => b.dataset.on === '1').length; bar.style.width = (d / cfg.items.length * 100) + '%'; count.textContent = d + ' / ' + cfg.items.length; };\n      wrap.innerHTML = cfg.items.map((t, i) => `<button data-cb data-i=\"${i}\" style=\"display:flex;align-items:flex-start;gap:14px;text-align:right;width:100%;border:1px solid;border-radius:16px;padding:15px 18px;cursor:pointer;font-family:inherit;transition:all .2s;\"><span data-tick style=\"flex:none;width:24px;height:24px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;transition:all .2s;\"><\u002Fspan><span data-label style=\"font-size:16px;font-weight:500;line-height:1.5;\">${t}<\u002Fspan><\u002Fbutton>`).join('');\n      $$('[data-cb]', holder).forEach(btn => {\n        const on = localStorage.getItem(LS + key + '_' + btn.dataset.i) === '1';\n        btn.dataset.on = on ? '1' : '0'; paint(btn, on);\n        btn.addEventListener('click', () => { const n = btn.dataset.on !== '1'; btn.dataset.on = n ? '1' : '0'; localStorage.setItem(LS + key + '_' + btn.dataset.i, n ? '1' : '0'); paint(btn, n); update(); });\n      });\n      update();\n    });\n  }\n  componentWillUnmount() { if (this._onScroll) window.removeEventListener('scroll', this._onScroll); }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
